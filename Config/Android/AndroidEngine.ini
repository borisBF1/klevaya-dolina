[SystemSettings]
; Render the canvas at the phone's native resolution (crisp pixel art and text).
r.MobileContentScaleFactor=0
t.MaxFPS=60

; HTTPS on Android goes through the engine's libcurl, which trusts only the staged cacert.pem and the old system folder
; /system/etc/security/cacerts. With this key UAT stages Engine/Content/Certificates/ThirdParty/cacert.pem
; (CopyBuildToStagingDirectory reads n.VerifyPeer); without it the phone could not verify the server's certificate and
; the game stayed offline (0.4). Never set it to False: that switches the certificate check off.
[/Script/Engine.NetworkSettings]
n.VerifyPeer=True
