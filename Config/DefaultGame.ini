[FishingValley.Online]
; Update 4: online profile / leaderboards / backups (PHP server in Server/Fishing-game).
; The default address is built into the game: FV_SERVER_BASE_URL in Source/FishingValley/Private/FVOnline.cpp
; (UFVOnline::ConfiguredServerUrl). The public source ships the placeholder https://example.com/Fishing-game/, so a
; build from source plays offline until you deploy Server/Fishing-game and put its api.php address here (or rebuild
; with your own FV_SERVER_BASE_URL). A different address here overrides the built-in one; ServerUrl=off turns the
; online features off. KEEP THE QUOTES: the engine reads an unquoted "//" as the start of a comment, so
; ServerUrl=https://... arrives as "https:" (that is why 0.4 / 0.4.1 stayed «Онлайн отключён»).
; Local tests: -fvserver=http://127.0.0.1:8080/api.php (the autotest stays offline unless -fvserver is given).
ServerUrl="https://example.com/Fishing-game/api.php"
