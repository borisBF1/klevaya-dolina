[/Script/Engine.InputSettings]
; Input is polled directly from the classic PlayerInput (no Enhanced Input assets needed).
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
; F11 is handled by the game (windowed 1280x720 <-> borderless fullscreen); Alt+Enter keeps the engine toggle.
bF11TogglesFullscreen=False
bAltEnterTogglesFullscreen=True
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=DoNotLock
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=False
; The game draws its own touch controls (joystick + action button): no engine virtual joysticks.
DefaultTouchInterface=None
bUseMouseForTouch=False
